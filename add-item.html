<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Sale</title>
    <link rel="stylesheet" href="add-item.css">
</head>
<body>
    <div class="form-container">
        <h1>Add a New Sale</h1>
        <p>Enter the details below. After adding, you will be taken to the dashboard.</p>
        <form id="add-sale-form">
            <div class="form-group">
                <label for="product-name">Product Name</label>
                <input type="text" id="product-name" placeholder="e.g., Webcam Pro" required>
            </div>
            <div class="form-group">
                <label for="sale-amount">Sale Amount ($)</label>
                <input type="number" id="sale-amount" placeholder="e.g., 75.50" step="0.01" required>
            </div>
            <div class="form-group">
                <label for="sale-quantity">Quantity</label>
                <input type="number" id="sale-quantity" value="1" min="1" required>
            </div>
            <button type="submit" class="submit-btn">Add Sale & View Dashboard</button>
            <a href="index.html" class="skip-link">Skip and go to Dashboard &rarr;</a>
        </form>
    </div>
    <script src="add-item.js"></script>
</body>
</html>
